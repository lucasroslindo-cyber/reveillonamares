main{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:48px 16px calc(48px + env(safe-area-inset-bottom));text-align:center}
.presents{display:flex;flex-direction:column;align-items:center;gap:4px}
.presents img{width:120px;height:auto}
.presents span{font-size:8px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);padding-left:.32em}
.kicker{font-family:var(--display);font-size:13px;letter-spacing:.42em;color:#111;margin:44px 0 6px;padding-left:.42em}
.logo{width:68%;max-width:300px;height:auto;display:block}
.rule{width:56px;height:1px;background:var(--line);margin:44px 0 26px}
.lbl{font-size:11.5px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--ink);margin:0 0 22px;padding-left:.32em}
.lbl i{font-style:normal;color:var(--gold);margin:0 .5em}
.choices{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
.choices a{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:999px;text-decoration:none;font-family:var(--body);font-weight:700;font-size:16px;letter-spacing:.2em;text-transform:uppercase;padding-left:.2em;transition:background .2s,color .2s}
.choices .pt{background:var(--ink);color:var(--paper)}
.choices .en{border:1px solid var(--ink);color:var(--ink);background:transparent}
.choices a:hover,.choices a:focus-visible{background:#2a231b;color:var(--paper);outline:none}
.choices a:focus-visible{box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--gold)}
.when{font-family:var(--display);font-size:11px;letter-spacing:.3em;color:var(--gold);margin:36px 0 0;padding-left:.3em}
@media (prefers-reduced-motion:no-preference){
  main>*{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
  main>*:nth-child(2){animation-delay:.08s} main>*:nth-child(3){animation-delay:.16s}
  main>*:nth-child(n+4){animation-delay:.3s}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
</style>
